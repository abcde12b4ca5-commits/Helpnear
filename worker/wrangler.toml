name = "helpnear-worker"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Fair-use rules (auto-confirm, release, strikes, freezes) run on this schedule. Admin > Settings can switch them off.
[triggers]
crons = ["*/15 * * * *"]

# Workers AI writes the blog drafts (free daily allowance, no key). Admin > Articles uses it.
[ai]
binding = "AI"

# Variables (FIREBASE_PROJECT_ID, FIREBASE_APP_ID, ALLOWED_ORIGINS, SITE_URL) are NOT kept in this file any more: they live on the worker itself
# (Cloudflare dashboard > Workers & Pages > helpnear-worker > Settings > Variables), and `keep_vars` makes every deploy, including the automatic
# one from GitHub, leave them untouched. Set them once there. Values:
#   FIREBASE_PROJECT_ID = your Firebase project id        FIREBASE_APP_ID = Firebase console > Project settings > Your apps (1:123:web:abc)
#   ALLOWED_ORIGINS = https://your-site.pages.dev          SITE_URL = https://your-site.pages.dev
keep_vars = true

# Secrets (never commit): wrangler secret put FIREBASE_SA_JSON ; wrangler secret put TURNSTILE_SECRET

# Optional (blog): wrangler secret put PEXELS_API_KEY   (free key from pexels.com/api, for stock photos)
# Optional (blog): INDEXNOW_KEY = "<the key in public/<key>.txt>"   so new articles are announced to Bing immediately
