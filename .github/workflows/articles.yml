name: Articles
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch: {}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE_URL: https://helpnear.pages.dev
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Run the scheduled article job
        run: |
          set -e
          if [ -z "$CRON_SECRET" ]; then echo "The repository secret CRON_SECRET is not set"; exit 1; fi
          code=$(curl -sS -o resp.txt -w "%{http_code}" --max-time 180 -X POST "$SITE_URL/api/articles/cron" -H "x-cron-secret: $CRON_SECRET")
          echo "HTTP $code"; cat resp.txt; echo
          [ "$code" = "200" ]
