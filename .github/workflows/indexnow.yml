name: IndexNow
on:
  push:
    branches: [main]
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://helpnear.pages.dev
      INDEXNOW_KEY: 96e4c9acc2979bda469462f54a5bc37c
    steps:
      - name: Wait for the deploy to go live
        run: sleep 240
      - name: Send URLs to IndexNow
        run: |
          set -e
          HOST="${SITE_URL#https://}"
          curl -fsS "$SITE_URL/sitemap.xml" -o sitemap.xml
          URLS=$(grep -oP '(?<=<loc>)[^<]+' sitemap.xml | sed 's/.*/"&"/' | paste -sd, -)
          curl -sS -o resp.txt -w "IndexNow HTTP %{http_code}\n" -X POST "https://www.bing.com/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"$HOST\",\"key\":\"$INDEXNOW_KEY\",\"keyLocation\":\"$SITE_URL/$INDEXNOW_KEY.txt\",\"urlList\":[$URLS]}"
          cat resp.txt
