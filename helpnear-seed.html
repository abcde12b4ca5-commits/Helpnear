 label{display:block;margin-top:12px;font-weight:bold}

 button:disabled{opacity:.5}

<h2>زرع بيانات Helpnear (مرة واحدة)</h2>
<div class="note">الصفحة دي بتشتغل على جهازك فقط وبتتصل بـ Firebase مباشرة. الباسورد مش بيتحفظ ولا بيتبعت لأي مكان تاني. بتتخطى أي مستند موجود فمفيش حاجة بتتمسح أو بتتكتب فوقها.</div>

<label>apiKey</label><input id="apiKey">
<label>authDomain</label><input id="authDomain" placeholder="your-project.firebaseapp.com">
<label>projectId</label><input id="projectId">
<label>appId</label><input id="appId">
<label>إيميل الأدمن (اللي ضفته في Authentication)</label><input id="email" type="email">
<label>باسورد الأدمن</label><input id="password" type="password">
<button id="go">ابدأ الزرع</button>
<div id="log">جاهز.</div>

const logEl = document.getElementById('log');
const log = (t) => { logEl.textContent += '\n' + t; logEl.scrollTop = logEl.scrollHeight; };
const val = (id) => document.getElementById(id).value.trim();

document.getElementById('go').addEventListener('click', async () => {
  const btn = document.getElementById('go');
  btn.disabled = true;
  logEl.textContent = 'بدأنا...';
  try {
    const cfg = { apiKey: val('apiKey'), authDomain: val('authDomain'), projectId: val('projectId'), appId: val('appId') };
    if (!cfg.apiKey || !cfg.projectId || !val('email') || !val('password')) throw new Error('كمّل كل الخانات الأول');
    const app = initializeApp(cfg);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const cred = await signInWithEmailAndPassword(auth, val('email'), val('password'));
    log('تم تسجيل الدخول. UID: ' + cred.user.uid);

    let created = 0, skipped = 0;
    async function putIfMissing(path, data) {
      const ref = doc(db, path);
      if ((await getDoc(ref)).exists()) { skipped++; log('skip   ' + path); return; }
      await setDoc(ref, data);
      created++; log('create ' + path);
    }
    for (const c of DATA.categories) { const { id, ...rest } = c; await putIfMissing('categories/' + id, rest); }
    await putIfMissing('config/app', DATA.appConfig);
    for (const l of DATA.legal) { const { id, ...rest } = l; await putIfMissing('legal/' + id, { ...rest, publishedAt: serverTimestamp() }); }
    log('\nخلصنا. اتعمل: ' + created + ' / اتخطى: ' + skipped);
    log('تقدر تقفل الصفحة دي وتجرّب التسجيل في الموقع.');
  } catch (e) {
    log('\nخطأ: ' + (e.code || '') + ' ' + (e.message || e));
    if ((e.code || '').includes('permission-denied')) log('الحساب ده مش مسجّل كأدمن: راجع مستند admins/UID في Firestore.');
  } finally { btn.disabled = false; }
});
</script>
</body>
</html>
